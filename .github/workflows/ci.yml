name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client & Run Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/habit_tracker?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./server

      - name: Build Backend (TypeScript)
        run: npm run build
        working-directory: ./server

      - name: Run Vitest Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/habit_tracker?schema=public"
          JWT_SECRET: "ci-testing-jwt-secret-key-123456789"
          REDIS_URL: "redis://localhost:6379"
          NODE_ENV: "test"
        run: npm run test
        working-directory: ./server

  build-client:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: ./client

      - name: Build Frontend (Vite)
        env:
          VITE_API_URL: "http://localhost:5000/api"
        run: npm run build
        working-directory: ./client
